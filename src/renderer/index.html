<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self' data:">
  <title>UAT Studio</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body data-vista="a-carregar">
  <!-- Vista 1: escolher ou criar projeto -->
  <section id="vista-boas-vindas" class="boas-vindas" hidden></section>

  <!-- Vista 2: a aplicação, com um projeto aberto -->
  <div id="vista-app" class="app" hidden>
    <aside class="lateral">
      <div class="marca">
        <span class="marca-logo">U</span>
        <div class="marca-textos">
          <span class="marca-nome">UAT Studio</span>
          <span id="nome-projeto" class="marca-projeto"></span>
        </div>
      </div>

      <nav class="menu" id="menu" aria-label="Ecrãs"></nav>

      <div class="lateral-ferramentas">
        <button id="btn-pesquisa" class="botao botao-discreto" type="button" title="Procurar e abrir um cenário, bloco, épico, aplicação ou ecrã">Procurar <kbd>Ctrl+K</kbd></button>
        <button id="btn-configuracoes" class="botao botao-discreto" type="button" title="Modo (simples/avançado), tema, tutorial e desempenho">Configurações</button>
        <button id="indicador-modo" class="indicador-modo" type="button" title="Algumas opções avançadas estão escondidas. Mudar em Configurações › Modo." hidden>Modo simples · ver tudo</button>
      </div>

      <div class="lateral-fundo">
        <label class="rotulo-lateral" for="escolha-projeto">Projeto</label>
        <select id="escolha-projeto" class="campo campo-escuro escolha-projeto"></select>
        <label class="rotulo-lateral" for="escolha-ambiente">Ambiente</label>
        <div class="linha-ambiente">
          <select id="escolha-ambiente" class="campo campo-escuro"></select>
          <span id="tipo-ambiente" class="etiqueta-ambiente"></span>
        </div>
        <button id="btn-fechar-projeto" class="botao botao-discreto" type="button">Mudar de projeto</button>
      </div>
    </aside>

    <main class="conteudo">
      <div id="faixa-ambiente" class="faixa-ambiente" role="status"></div>
      <header class="cabecalho">
        <div>
          <nav id="caminho" class="caminho" aria-label="Onde está"></nav>
          <h1 id="titulo-ecra"></h1>
          <p id="descricao-ecra"></p>
        </div>
        <div id="acoes-ecra" class="acoes"></div>
      </header>
      <div id="corpo-ecra" class="corpo"></div>
    </main>
  </div>

  <script type="module" src="../../dist/web/renderer/app.js"></script>
</body>
</html>
